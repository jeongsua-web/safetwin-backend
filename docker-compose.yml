services:
  db:
    image: postgres:16-alpine
    container_name: safetwin-db
    environment:
      POSTGRES_DB: safetwin
      POSTGRES_USER: ${DB_USERNAME:-safetwin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-safetwin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-safetwin} -d safetwin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: safetwin-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USERNAME: ${DB_USERNAME:-safetwin}
      DB_PASSWORD: ${DB_PASSWORD:-safetwin}
      JWT_SECRET: ${JWT_SECRET}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-safetwin-bucket}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NTS_API_KEY: ${NTS_API_KEY:-}
      LAW_API_KEY: ${LAW_API_KEY:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/safetwin
    username: ${DB_USERNAME:safetwin}
    password: ${DB_PASSWORD:safetwin}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.safetwin: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

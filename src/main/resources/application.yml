spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: jdbc:postgresql://localhost:5432/safetwin
    username: ${DB_USERNAME:safetwin}
    password: ${DB_PASSWORD:safetwin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:safetwin-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiration: 1800000   # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:safetwin-bucket}
    region: ${AWS_REGION:ap-northeast-2}
  credentials:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.0-flash
  max-tokens: 4096

google:
  client-id: ${GOOGLE_CLIENT_ID:}

nts:
  api-key: ${NTS_API_KEY:}
  api-url: https://api.odcloud.kr/api/nts-businessman/v1/status

law:
  api-key: ${LAW_API_KEY:}
  api-url: https://www.law.go.kr/DRF/lawSearch.do
